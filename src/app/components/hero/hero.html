<section class="hero" id="top">
  <div class="wrap hero-grid">
    <div class="hero-main">
      <p class="hero-kicker">{{ profile.kicker }}</p>
      <h1 class="hero-name">
        <span class="line">{{ profile.firstName }}</span>
        <span class="line">{{ profile.lastName }}</span>
      </h1>
      <p class="hero-lede">{{ profile.lede }}</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#contact">
          Me contacter
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a class="btn btn-ghost" href="#projets">Voir les projets</a>
        <a class="btn btn-ghost" [href]="profile.cvUrl" download>
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          CV (PDF)
        </a>
      </div>
    </div>

    <aside class="spec" aria-label="Fiche rapide">
      @for (row of profile.spec; track row.label) {
        <div class="spec-row" [class.spec-row--status]="row.status">
          <span class="spec-k">{{ row.label }}</span>
          <span class="spec-v">
            @if (row.status) {
              <span class="status-dot" aria-hidden="true"></span>
            }
            {{ row.value }}
          </span>
        </div>
      }
    </aside>
  </div>
</section>
